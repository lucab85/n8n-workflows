name: Deploy Gmail AI triage to n8n

on:
  push:
    branches: [main]
    paths:
      - workflows/gmail-ai-triage.json
      - .github/workflows/deploy-gmail-ai-triage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      N8N_BASE_URL: https://n8n.openempower.com
      WORKFLOW_FILE: workflows/gmail-ai-triage.json
      WORKFLOW_NAME: Gmail AI Triage — Action Queues

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credential
        shell: bash
        run: |
          if [ -z "${{ secrets.N8N_API_KEY }}" ]; then
            echo "::error::Repository secret N8N_API_KEY is not configured. Create an n8n API key in Settings → n8n API and save it as the GitHub Actions secret N8N_API_KEY."
            exit 1
          fi

      - name: Validate workflow JSON
        run: jq empty "$WORKFLOW_FILE"

      - name: Create or update workflow
        id: deploy
        shell: bash
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -euo pipefail

          jq '{name, nodes, connections, settings}' "$WORKFLOW_FILE" > /tmp/workflow-clean.json

          list_response=$(curl --fail-with-body --silent --show-error \
            "$N8N_BASE_URL/api/v1/workflows?limit=250" \
            -H "X-N8N-API-KEY: $N8N_API_KEY")

          workflow_id=$(jq -r --arg name "$WORKFLOW_NAME" \
            '.data[]? | select(.name == $name) | .id' <<<"$list_response" | head -n1)

          gmail_cred=""

          if [ -n "$workflow_id" ]; then
            existing=$(curl --fail-with-body --silent --show-error \
              "$N8N_BASE_URL/api/v1/workflows/$workflow_id" \
              -H "X-N8N-API-KEY: $N8N_API_KEY")

            gmail_cred=$(jq -c '
              [.nodes[]?
                | select(.type == "n8n-nodes-base.gmail")
                | .credentials.gmailOAuth2?
                | select(. != null)
              ][0] // empty
            ' <<<"$existing")
          fi

          if [ -z "$gmail_cred" ]; then
            gmail_cred=$(jq -c '
              [.data[]?.nodes[]?
                | select(.type == "n8n-nodes-base.gmail" or .type == "n8n-nodes-base.gmailTrigger")
                | .credentials.gmailOAuth2?
                | select(. != null)
              ][0] // empty
            ' <<<"$list_response")
          fi

          if [ -n "$gmail_cred" ]; then
            jq --argjson cred "$gmail_cred" '
              .nodes |= map(
                if .type == "n8n-nodes-base.gmail"
                then . + {credentials: {gmailOAuth2: $cred}}
                else .
                end
              )
            ' /tmp/workflow-clean.json > /tmp/workflow.json
            credential_ready=true
            echo "Reusing existing Gmail OAuth2 credential reference."
          else
            cp /tmp/workflow-clean.json /tmp/workflow.json
            credential_ready=false
            echo "::warning::No Gmail OAuth2 credential reference was found in existing n8n workflows. The workflow will be created/updated inactive; bind Gmail once in the n8n UI, then rerun this Action."
          fi

          if [ -n "$workflow_id" ]; then
            echo "Updating existing workflow $workflow_id"
            response=$(curl --fail-with-body --silent --show-error \
              -X PUT "$N8N_BASE_URL/api/v1/workflows/$workflow_id" \
              -H "X-N8N-API-KEY: $N8N_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/workflow.json)
          else
            echo "Creating workflow"
            response=$(curl --fail-with-body --silent --show-error \
              -X POST "$N8N_BASE_URL/api/v1/workflows" \
              -H "X-N8N-API-KEY: $N8N_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/workflow.json)
            workflow_id=$(jq -r '.id' <<<"$response")
          fi

          if [ -z "$workflow_id" ] || [ "$workflow_id" = "null" ]; then
            echo "::error::n8n did not return a workflow id"
            echo "$response"
            exit 1
          fi

          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"
          echo "credential_ready=$credential_ready" >> "$GITHUB_OUTPUT"

      - name: Publish workflow
        if: steps.deploy.outputs.credential_ready == 'true'
        shell: bash
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          WORKFLOW_ID: ${{ steps.deploy.outputs.workflow_id }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error -o /tmp/publish-response.json -w '%{http_code}' \
            -X POST "$N8N_BASE_URL/api/v1/workflows/$WORKFLOW_ID/publish" \
            -H "X-N8N-API-KEY: $N8N_API_KEY")

          if [[ "$status" =~ ^2 ]]; then
            echo "Published workflow"
          elif [ "$status" = "404" ]; then
            echo "Publish endpoint unavailable on this n8n version; activation will be attempted directly."
          else
            cat /tmp/publish-response.json
            echo "::error::Publish failed with HTTP $status"
            exit 1
          fi

      - name: Activate workflow
        if: steps.deploy.outputs.credential_ready == 'true'
        shell: bash
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          WORKFLOW_ID: ${{ steps.deploy.outputs.workflow_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$N8N_BASE_URL/api/v1/workflows/$WORKFLOW_ID/activate" \
            -H "X-N8N-API-KEY: $N8N_API_KEY" \
            -o /tmp/activate-response.json
          jq '{id, name, active}' /tmp/activate-response.json || cat /tmp/activate-response.json

      - name: Verify deployment
        shell: bash
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          WORKFLOW_ID: ${{ steps.deploy.outputs.workflow_id }}
          CREDENTIAL_READY: ${{ steps.deploy.outputs.credential_ready }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            "$N8N_BASE_URL/api/v1/workflows/$WORKFLOW_ID" \
            -H "X-N8N-API-KEY: $N8N_API_KEY")

          echo "$response" | jq '{
            id,
            name,
            active,
            gmail_nodes: [.nodes[] | select(.type == "n8n-nodes-base.gmail") | {name, has_gmail_credential: (.credentials.gmailOAuth2 != null)}],
            schedule_nodes: [.nodes[] | select(.type == "n8n-nodes-base.scheduleTrigger") | {name, rule: .parameters.rule}]
          }'

          active=$(jq -r '.active' <<<"$response")
          if [ "$CREDENTIAL_READY" = "true" ] && [ "$active" != "true" ]; then
            echo "::error::Workflow has Gmail credentials but is not active."
            exit 1
          fi

          if [ "$CREDENTIAL_READY" != "true" ]; then
            echo "::notice::Workflow deployed but intentionally left inactive. Bind a Gmail OAuth2 credential to its Gmail nodes in n8n, then rerun this Action."
          fi
